<!DOCTYPE html>
<html lang="en">
<head>
    <title>ShadowTrace Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <form method="POST" class="bg-gray-800 p-6 rounded-xl w-80 shadow-xl">
        <h2 class="text-xl font-bold mb-4">Admin Login</h2>

        {% if error %}
        <p class="text-red-400 text-sm mb-3">{{ error }}</p>
        {% endif %}

        <input name="username"
               placeholder="Username"
               class="w-full p-2 mb-3 bg-gray-700 rounded" />

        <input name="password" type="password"
               placeholder="Password"
               class="w-full p-2 mb-4 bg-gray-700 rounded" />

        <button class="bg-blue-600 w-full py-2 rounded hover:bg-blue-500">
            Login
        </button>
    </form>

</body>
</html>
